# add cmake to build requirements
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LogDatasets"
version = "0.1.0"
description = "Log datasets"
readme = "README.md"
requires-python = "==3.13.16"
dependencies = [
    "detectmateperformance>=0.1.5",
    "fastapi[standard]>=0.141.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scipy",
    "tabulate>=0.10.0",
    "tqdm>=4.68.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
logdataset = "logdatasets.cli:main"
